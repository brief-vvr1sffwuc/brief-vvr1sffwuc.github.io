name: Refresh the news
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 13-21 * * 1-5"
    - cron: "47 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 refresh.py .
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_TICKERS: ${{ secrets.SUMMARY_TICKERS }}
      - run: |
          git config user.name briefing
          git config user.email briefing@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "News refresh"
          git pull --rebase
          git push
